var kpis='<div class="three"><div class="card metric"><small>Leerlingen aangemeld</small><strong>'+n+'</strong><span class="muted small">Live verbonden via lescode</span></div><div class="card metric"><small>Scan afgerond</small><strong>'+scanDone+'/'+n+'</strong><span class="muted small">Persoonlijke boost gereed</span></div><div class="card metric"><small>Eindmissie afgerond</small><strong>'+finalDone+'/'+n+'</strong><span class="muted small">Individuele controle</span></div></div>';
var controls='<div class="panel" style="margin-top:17px"><div class="row between"><div><p class="eyebrow">LESBEDIENING</p><h2 class="section-title">Fase '+(D.phase+1)+': '+PHASES[D.phase]+'</h2></div><div class="row"><button class="btn" id="prevPhase" '+(D.phase===0?"disabled":"")+'>← Vorige fase</button><button class="btn primary" id="nextPhase" '+(D.phase===5?"disabled":"")+'>Volgende fase →</button></div></div>'+phasebar()+'<p class="muted">Fasesynchronisatie: leerlingen zien binnen enkele seconden jouw gekozen ronde.</p><div class="row"><button class="btn" id="startNew">+ Nieuwe lessessie</button><button class="btn" id="copyStudents">Kopieer leerlinglink</button><button class="btn" id="copyBoard">Kopieer digibordlink</button><button class="btn" id="openBoard">🖥️ Open digibord</button><button class="btn ghost" id="signOut">Uitloggen</button></div><div class="notice">Leerlinglink: <strong>'+esc(urlFor("leerling"))+'</strong></div></div>';
var teams='<div class="panel"><p class="eyebrow">SPEL & TEAMINDELING</p><h2 class="section-title">Duo / Solo Challenge</h2><div class="row"><label class="label">Spelvorm</label><select id="setMode"><option value="duo" '+(D.mode==="duo"?"selected":"")+'>Duo Challenge</option><option value="solo" '+(D.mode==="solo"?"selected":"")+'>Solo Challenge</option></select><button class="btn" id="makeTeams" '+(D.mode==="solo"?"disabled":"")+'>🤝 Maak slimme duo's</button><button class="btn primary" id="publishTeams" '+(D.mode==="solo"||!D.teams.length?"disabled":"")+'>'+(D.teamsPublished?"Teams opnieuw publiceren":"Teams onthullen")+'</button></div><p class="muted small">Slimme duo's combineren hogere en lagere Scanresultaten. Bij een oneven aantal leerlingen komt één drietal.</p>'+(D.mode==="duo"?D.teamScores.map(function(t){var names=t.members.map(function(id){var s=D.students.find(function(p){return p.id===id});return s?s.name:"Leerling"});return '<div class="mini-card"><span>🤝</span><div style="flex:1"><strong>'+esc(t.name)+'</strong><p class="muted small" style="margin:0">'+esc(names.join(" + "))+'</p></div><strong class="score">'+t.score+' pt</strong></div>'}).join(""):'<div class="notice">Solo Challenge: leerlingen verdienen individuele spelpunten.</div>')+'<hr class="separator"/><button class="btn gold" id="revealWinner" '+(D.winnerRevealed?"disabled":"")+'>🏆 Winnaar onthullen</button>'+(D.winnerRevealed?'<p class="flash">Winnaar onthuld! Bekijk het digibord.</p>':'<p class="muted small">Leerlingen zien geen klassikale winnaar voordat jij die onthult.</p>')+'</div>';
var list='<div class="panel"><p class="eyebrow">VOORTGANG VAN DE KLAS</p><h2 class="section-title">Leerlingoverzicht</h2><div class="tablewrap"><table><thead><tr><th>Leerling</th><th>Scan</th><th>Boost</th><th>Challenge</th><th>Eindmissie</th><th>Punten</th></tr></thead><tbody>'+D.students.map(function(s){return '<tr><td>'+esc(s.name)+'</td><td>'+s.scan+'/8</td><td>'+s.boost+'</td><td>'+s.challenge+'/9</td><td>'+s.mission+'/6</td><td><strong>'+s.points+'</strong></td></tr>'}).join("")+'</tbody></table></div>'+(n?'<p class="muted small">Resultaten worden iedere vijf seconden ververst.</p>':'<div class="notice">Nog geen leerlingen ingelogd. Deel de leerlinglink of lescode '+esc(CODE)+'.</div>')+'</div>';
var open=D.teacherAnswers.filter(function(a){return a.question==="f5"||a.question==="f6"}).map(function(a){return '<div class="lessonbox"><strong>'+esc(a.student)+' · '+esc(a.question)+'</strong><p>'+esc(a.answer)+'</p><div class="row">'+[0,1,2].map(function(pts){return '<button class="btn" data-grade="'+pts+'" data-student="'+esc(a.student_id)+'" data-question="'+esc(a.question)+'">'+pts+' pt</button>'}).join("")+'</div></div>'}).join("");
return hero+kpis+controls+'<div class="grid" style="align-items:start; margin-top:16px"><div>'+teams+'</div><div>'+list+'</div></div>'+(open?'<div class="panel" style="margin-top:16px"><p class="eyebrow">OPEN VRAGEN NAKIJKEN</p>'+open+'</div>':'')}
function fakeBook(){return '<div class="bookpreview"><small style="font-weight:700;color:#428765">BRONNEN VAN ENERGIE · HOOFDSTUK 6 · DE GEO</small><div style="background:#368b57;color:white;padding:9px 16px;margin:15px -32px"><strong>6 · Energie in Brazilië</strong></div><h1>6.1 De economie van Brazilië</h1><div class="spread"><div><h2>Groot land met een grote bevolking</h2><p>Brazilië is groot in oppervlakte en bevolking. Veel mensen wonen in steden; de bevolking is ongelijk over het land verspreid.</p><h2>Welvaartsgroei</h2><p>Brazilië wordt een <strong>opkomende economie</strong> genoemd. Industrie, landbouwexport en diensten leverden economische groei op.</p><p>De grotere welvaart en productie zorgen ook voor een grotere vraag naar energie.</p></div><div><h2>Economische crisis</h2><p>Na jaren van groei kreeg Brazilië rond 2014 te maken met een economische terugval. Ook corruptieschandalen speelden een rol.</p><h2>Corruptie</h2><p>De bron beschrijft het onderzoek Lava Jato en de gevolgen voor politiek en bedrijfsleven.</p><div class="book-data"><strong>De centrale vraag</strong><p>Hoe maakt economische groei Brazilië welvarender, en waarom profiteren niet alle inwoners evenveel?</p></div></div></div><p style="font-size:12px;color:#57776a">Leesbare lesvisualisatie, gebaseerd op §6.1. Gebruik de knop 'Originele afbeelding kiezen' om de exacte aangeleverde boekscan op dit digibord te tonen.</p></div>'}
function boardUI(){var completed=D.students.filter(function(s){return D.phase===0?s.scan>=8:D.phase===4?s.mission>=6:D.phase===2?s.challenge>=9:false}).length;
var intro='<div class="intro"><div><span class="pill">🌎 MARIS CLASSROOM · 3TL</span><h1 class="title">Energie in<br><span style="color:var(--aqua)">Brazilië</span></h1><p class="subtitle" style="margin:15px auto 26px">Van economische groei tot de energiemix.<br>Wie kan Brazilië van de juiste energie voorzien?</p><button class="btn primary" id="startShow" style="padding:16px 26px;font-size:19px">▶ Start de les met geluid</button><p class="muted">De lesinhoud op het digibord is gekoppeld aan dezelfde online lessessie als de leerlingen.</p></div></div>';
if(opening)return intro+'<div class="row between"><button class="btn ghost" id="backDashboard">← Docentportaal</button><span class="pill">LESCODE '+esc(CODE)+'</span></div>';
var header='<section class="hero"><div><p class="eyebrow">DIGIBORD · '+esc(D.title)+'</p><h1 class="title">'+esc(PHASES[D.phase])+'</h1><p class="subtitle">'+esc(SUBS[D.phase])+'</p><div class="row"><span class="pill">FASE '+(D.phase+1)+'/6</span><span class="tag">'+esc(CODE)+'</span></div></div><div class="hero-art"><div class="flag"></div><div class="art-text"><span>ENERGIE IN BRAZILIË</span>DENK · LEER · SPEEL</div></div></section>'+phasebar();
var control='<div class="panel"><div class="row between"><div><p class="eyebrow">TIJDSBEWAKING</p><div class="timer" id="timerReadout">'+Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,"0")+'</div></div><div class="row"><button class="btn" id="timerToggle">'+(timerOn?"⏸ Pauze":"▶ Start timer")+'</button><button class="btn" id="timerReset">↺ 5 min</button></div></div><hr class="separator"/><div class="row"><button class="btn" id="phaseBack" '+(D.phase===0?"disabled":"")+'>← Vorige fase</button><button class="btn primary" id="phaseNext" '+(D.phase===5?"disabled":"")+'>Volgende fase →</button><button class="btn" id="showBook">📖 Toon §6.1 op het bord</button><button class="btn" id="loadBook">🖼️ Originele afbeelding kiezen</button><input id="bookFile" type="file" accept="image/*" hidden><button class="btn ghost" id="backDashboard">Docentportaal</button></div><p class="bookhint">Je kunt een afbeelding van de boekpagina openen via 'Originele afbeelding kiezen'. Die blijft op dit apparaat en wordt niet openbaar geüpload.</p></div>';
var instruction='<div class="panel"><p class="eyebrow">KLASSIKALE INSTRUCTIE</p><h2 class="section-title">'+esc(PHASES[D.phase])+'</h2>'+[
'<p>Vraag: hoe kan Brazilië groeien en tegelijk grote verschillen tussen rijk en arm kennen?</p><p>Leerlingen maken zelfstandig acht Scanvragen op hun laptop. Nog geen antwoorden klassikaal verklappen.</p>',
'<p>Iedere leerling krijgt uitleg op maat, afhankelijk van de fouten uit de Scan. Laat ze rustig lezen en de oefenvragen maken.</p><p>Bespreek: waarom is de <strong>energiemix</strong> niet hetzelfde als de mix van elektriciteit?</p>',
'<p>Speel drie levels: 100, 200 en 300 punten. Bij duo’s kunnen leerlingen 50 bonuspunten per gezamenlijke goede vraag verdienen.</p><p>Stimuleer de duo’s om hun keuzes uit te leggen.</p>',
'<p>Nieuwe vaardigheid: vergelijk twee verschillende grafieken. Wat betekent de noemer? Vergelijk de energiebronnen voor het totale verbruik met alleen elektriciteit.</p>'+visualMix(),
'<p>Leerlingen maken de Eindmissie individueel: vier gesloten en twee open toepassingsvragen.</p><p>Gebruik het docentportaal om open antwoorden te beoordelen.</p>',
'<p>Laat de leerlingen reflecteren en kies eventueel de volgende werkvorm op basis van hun feedback. Onthul de winnaar als je dat wilt.</p>'
][D.phase]+'</div>';
var state='<div class="panel"><p class="eyebrow">LIVE KLASOVERZICHT</p><div class="three"><div class="metric"><small>Aangemeld</small><strong>'+D.students.length+'</strong></div><div class="metric"><small>Klaar deze fase</small><strong>'+completed+'</strong></div><div class="metric"><small>Lescode</small><strong style="font-size:20px">'+esc(CODE)+'</strong></div></div>'+(D.winnerRevealed?'<div class="notice"><strong>🏆 Winnaar onthuld!</strong><p>'+esc(winnerText())+'</p></div>':'<p class="muted small">De einduitslag blijft verborgen tot jij de winnaar onthult.</p>')+'</div>';
return header+control+'<div class="grid" style="align-items:start;margin-top:15px"><div>'+instruction+'</div><div>'+state+'<div style="margin-top:13px">'+waiting()+'</div></div></div>'}
function winnerText(){if(D.mode==="duo"){var scores=D.teamScores.slice().sort(function(a,b){return b.score-a.score});return scores.length?scores[0].name+" · "+scores[0].score+" punten":"Nog geen teams"}var best=D.students.slice().sort(function(a,b){return b.points-a.points});return best.length?best[0].name+" · "+best[0].points+" punten":"Nog geen resultaten"}
function render(){if(!sess){base(login());return}if(!D){base(login()+'<div class="notice">Meld je aan voor deze lessessie. Als je docent bent, controleer je account en de lescode.</div>');return}base(view==="docent"?teacherUI():view==="digibord"?boardUI():studentUI());if(bookOpen)openBook()}
async function patch(p){try{busy=true;await rpc("ak_teacher_set",{p_code:CODE,p_patch:p});busy=false;await refresh(true);msg("✓ Lesinstelling opgeslagen voor alle apparaten.")}catch(e){busy=false;msg("Wijzigen mislukt: "+e.message,true)}}
async function submit(q,value){if(busy)return;busy=true;msg("Antwoord opslaan…");try{var res=await rpc("ak_submit",{p_code:CODE,p_question:q.id,p_choice:value});busy=false;await refresh(true);msg(res.correct===false?"Antwoord opgeslagen. Lees de uitleg.":"✓ Antwoord online opgeslagen.")}catch(e){busy=false;msg("Opslaan mislukt: "+e.message,true)}}
function nextUnanswered(){var qs=currentBank();if(qs.length&&qs.every(function(q){return !!D.answers[q.id]}))return;var ix=qs.findIndex(function(q,i){return i>position&&!D.answers[q.id]});if(ix<0)ix=qs.findIndex(function(q){return !D.answers[q.id]});if(ix>=0)position=ix;render()}
function smarterTeams(){var s=D.students.slice().sort(function(a,b){return b.scanRight-a.scanRight});if(s.length<2){msg("Er zijn minimaal twee leerlingen nodig.",true);return}var pairs=[];while(s.length>=2){pairs.push([s.shift().id,s.pop().id])}if(s.length)pairs[pairs.length-1].push(s.shift().id);var teams=pairs.map(function(a,i){return{name:(a.length===3?"Trio ":"Duo ")+(i+1),members:a}});patch({teams:teams,teamsPublished:false})}
async function newSession(){if(!confirm("Een nieuwe lessessie maken? De bestaande les en antwoorden blijven bewaard."))return;try{var r=await rpc("ak_create",{p_title:"Energie in Brazilië · §6.1 en §6.2"});CODE=r.code;history.replaceState(null,"",location.pathname+"?code="+encodeURIComponent(CODE)+"#docent");D=null;lastPhase=null;await refresh(true);msg("Nieuwe sessie aangemaakt. Deel de nieuwe leerlinglink.")}catch(e){msg("Nieuwe sessie mislukt: "+e.message,true)}}
function copy(t){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){msg("✓ Link gekopieerd")}).catch(function(){window.prompt("Kopieer deze link:",t)});else window.prompt("Kopieer deze link:",t)}
function sound(){try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;var a=new AC();[220,329.6,440,554.3].forEach(function(h,i){var osc=a.createOscillator(),gain=a.createGain(),t=a.currentTime+i*.2;osc.type="sine";osc.frequency.setValueAtTime(h,t);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.08,t+.06);gain.gain.exponentialRampToValueAtTime(.0001,t+.9);osc.connect(gain);gain.connect(a.destination);osc.start(t);osc.stop(t+.92)})}catch(e){}}
function openBook(){bookOpen=true;var pop=document.getElementById("pop");if(!pop)return;pop.innerHTML='<div class="fullscreen"><div class="top-actions"><span class="pill">§ 6.1 · DE ECONOMIE VAN BRAZILIË</span><button class="btn primary" id="closeBook">✕ Sluiten</button></div><div id="bookBody" style="margin:auto;width:100%">'+(boardImage?'<img class="bookimage" src="'+boardImage+'" alt="Originele afbeelding hoofdstuk 6.1">':fakeBook())+'</div></div>';var b=document.getElementById("closeBook");if(b)b.onclick=function(){bookOpen=false;pop.innerHTML=""}}
function bind(){var e=document.getElementById("studentJoin");if(e)e.onsubmit=function(ev){ev.preventDefault();CODE=document.getElementById("theCode").value.trim().toUpperCase();history.replaceState(null,"",location.pathname+"?code="+encodeURIComponent(CODE));enterStudent(document.getElementById("studentName").value)};
e=document.getElementById("teacherJoin");if(e)e.onsubmit=function(ev){ev.preventDefault();enterTeacher(document.getElementById("teacherEmail").value,document.getElementById("teacherPass").value)};
document.querySelectorAll("[data-choice]").forEach(function(b){b.onclick=function(){var q=currentBank()[position];submit(q,Number(b.dataset.choice))}});
e=document.getElementById("saveAnswer");if(e)e.onclick=function(){var q=currentBank()[position];submit(q,document.getElementById("openAnswer").value.trim())};
e=document.getElementById("prevQ");if(e)e.onclick=function(){position=Math.max(0,position-1);render()};
e=document.getElementById("nextQ");if(e)e.onclick=nextUnanswered;
e=document.getElementById("reviewStart");if(e)e.onclick=function(){position=0;reviewMode=true;render()};
e=document.getElementById("studentRefresh");if(e)e.onclick=function(){refresh(true)};
e=document.getElementById("prevPhase");if(e)e.onclick=function(){patch({phase:D.phase-1})};
e=document.getElementById("nextPhase");if(e)e.onclick=function(){patch({phase:D.phase+1})};
e=document.getElementById("phaseBack");if(e)e.onclick=function(){patch({phase:D.phase-1})};
e=document.getElementById("phaseNext");if(e)e.onclick=function(){patch({phase:D.phase+1})};
e=document.getElementById("setMode");if(e)e.onchange=function(){patch({mode:this.value,teamsPublished:false})};
e=document.getElementById("makeTeams");if(e)e.onclick=smarterTeams;
e=document.getElementById("publishTeams");if(e)e.onclick=function(){patch({teamsPublished:true})};
e=document.getElementById("revealWinner");if(e)e.onclick=function(){if(confirm("Wil je de winnaar nu onthullen?"))patch({winnerRevealed:true})};
e=document.getElementById("startNew");if(e)e.onclick=newSession;
e=document.getElementById("copyStudents");if(e)e.onclick=function(){copy(urlFor("leerling"))};
e=document.getElementById("copyBoard");if(e)e.onclick=function(){copy(urlFor("digibord"))};
e=document.getElementById("openBoard");if(e)e.onclick=function(){window.open(urlFor("digibord"),"_blank","noopener")};
e=document.getElementById("signOut");if(e)e.onclick=function(){if(confirm("Uitloggen?"))resetIdentity()};
e=document.getElementById("backDashboard");if(e)e.onclick=function(){location.href=urlFor("docent")};
e=document.getElementById("startShow");if(e)e.onclick=function(){sound();opening=false;render()};
e=document.getElementById("timerToggle");if(e)e.onclick=function(){timerOn=!timerOn;render()};
e=document.getElementById("timerReset");if(e)e.onclick=function(){seconds=300;timerOn=false;render()};
e=document.getElementById("showBook");if(e)e.onclick=openBook;
e=document.getElementById("loadBook");if(e)e.onclick=function(){document.getElementById("bookFile").click()};
e=document.getElementById("bookFile");if(e)e.onchange=function(){var file=this.files[0];if(!file)return;if(file.size>12000000)return msg("Afbeelding is te groot (maximaal 12 MB).",true);var r=new FileReader();r.onload=function(){boardImage=r.result;openBook()};r.readAsDataURL(file)};
e=document.getElementById("reflectForm");if(e)e.onsubmit=async function(ev){ev.preventDefault();try{var r=await rpc("ak_reflect",{p_code:CODE,p_rating:Number(document.getElementById("rating").value),p_learned:document.getElementById("learned").value,p_next:document.getElementById("nextStyle").value});msg("✓ Dank je! De terugblik is opgeslagen.");e.querySelector("button").disabled=true}catch(err){msg("Terugblik mislukt: "+err.message,true)}};
document.querySelectorAll("[data-grade]").forEach(function(b){b.onclick=async function(){try{await rpc("ak_grade",{p_code:CODE,p_student:b.dataset.student,p_question:b.dataset.question,p_points:Number(b.dataset.grade)});msg("Beoordeling opgeslagen");await refresh(true)}catch(err){msg("Beoordeling mislukt: "+err.message,true)}}})
}
var reviewMode=false;
window.addEventListener("hashchange",function(){view=location.hash==="#docent"?"docent":location.hash==="#digibord"?"digibord":"leerling";D=null;lastPhase=null;render();refresh(true)});
authLoad();
render();
if(sess)refresh(true);
setInterval(function(){if(sess&&!busy&&!bookOpen)refresh(false)},5000);
setInterval(function(){if(timerOn&&seconds>0){seconds--;var e=document.getElementById("timerReadout");if(e)e.textContent=Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0");if(seconds===0){timerOn=false;sound()}}},1000);
})();
</script></body></html>
