<div class="app"><aside><div class="logo"><div class="mark">GEO FUTURE ROUTE</div><h2>GFR <span style="color:var(--aqua)">Learn Hub</span></h2><small>Aardrijkskunde · 3TL & 4TL</small></div><div><div class="navtitle">WERKOMGEVING</div><div class="nav"><button id="nav-teacher" onclick="setView('teacher')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="15" rx="2"/><path d="M8 22h8M12 18v4M7 8h10M7 12h6"/></svg><span>Docentportaal</span></button><button id="nav-board" onclick="setView('board')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="15" rx="2"/><path d="m7 11 3 3 7-7M9 21h6M12 18v3"/></svg><span>Digibord</span></button><button id="nav-student" onclick="setView('student')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 22v-2a8 8 0 0 1 16 0v2"/></svg><span>Leerlingomgeving</span></button></div></div><div class="sidebottom"><div class="miniNotice"><b>✦ Interactief ontwerp</b><p>Alle getoonde leerlingen en resultaten zijn fictief. Er worden geen echte gegevens opgeslagen.</p></div></div></aside>
<main class="main"><div class="top"><div class="crumb">GFR Learn Hub <span style="color:#53758c"> / </span><span id="breadcrumb">Docentportaal</span></div><div class="topR"><span class="pill"><span class="dot"></span> DEMO · OFFLINE</span><div class="avatar">GFR</div></div></div><div id="screen"></div></main></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const phases=[{name:'De Scan',sub:'Wat weet je al?',icon:'◎',duration:6},{name:'Kennisboost',sub:'Jouw leerroute',icon:'✦',duration:8},{name:'Duo / Solo Challenge',sub:'Spelend leren',icon:'⚡',duration:12},{name:'Nieuwe inhoud',sub:'Ontdek iets nieuws',icon:'◈',duration:8},{name:'De Eindmissie',sub:'Laat zien wat je kunt',icon:'◆',duration:7},{name:'Terug- & Vooruitblik',sub:'Reflecteer en kies',icon:'↗',duration:4}];

const classes=['3TL','4TL'];const state={view:'teacher',klas:'3TL',phase:0,mode:'duo',teamsMade:false,teamsPublished:false,winner:false,studentPhase:0,studentQuestion:0,answers:{},picked:null,boostStep:0,missionStep:0,joined:false,studentName:'',lesson:'Energie in Frankrijk',clock:420,clockRunning:false,score:0,minutes:12,teacherTab:'live'};

const el=id=>document.getElementById(id),safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(label,fn,extra='')=>`<button class="btn ${extra}" onclick="${fn}">${label}</button>`;const panel=(s,cls='')=>`<section class="card ${cls}">${s}</section>`;

function setView(v){state.view=v;window.location.hash=v;render()}function setClass(v){state.klas=v;toast('Demo-klas gewijzigd naar '+v);render()}

function lessonRows(){return `<div class="lessonList"><div class="lessonRow"><div class="lessonIcon">⚡</div><div><b>Energie in Frankrijk</b><p>Hoofdstuk 5 · ${state.klas} · 6 lesfasen · fictieve les</p></div>${btn('Open les','state.teacherTab="live";render()','sm')}</div><div class="lessonRow"><div class="lessonIcon">💧</div><div><b>Water in Nederland</b><p>4TL · Waterveiligheid · conceptles</p></div>${btn('Voorbeeld','toast("Deze les is een placeholder in het prototype")','secondary sm')}</div><div class="lessonRow"><div class="lessonIcon">🌍</div><div><b>Grenzen & identiteit</b><p>3TL · Grenzen en migratie · conceptles</p></div>${btn('Voorbeeld','toast("Deze les is een placeholder in het prototype")','secondary sm')}</div></div>`}
function teacher(){return `<div class="intro"><div><div class="eyebrow">DOCENTPORTAAL · LESOVERZICHT</div><h1>Welkom in GFR Learn Hub</h1><p>Beheer je aardrijkskundelessen en begeleid je klas. In dit prototype zie je fictieve leerlingen en kun je de zes fasen bedienen.</p></div><div class="flex"><select class="form" aria-label="Kies klas" onchange="setClass(this.value)">${classes.map(c=>`<option ${c===state.klas?'selected':''}>${c}</option>`).join('')}</select>${btn('Bekijk digibord','setView("board")','secondary')}</div></div><div class="kpis"><div class="kpi"><label>Verbonden leerlingen</label><strong>23<span style="font-size:17px;color:#88e5de"> / 23</span></strong><small>Fictieve klas</small></div><div class="kpi"><label>Huidige fase</label><strong>${state.phase+1}<span style="font-size:16px;color:#8cbecc"> / 6</span></strong><small>${phases[state.phase].name}</small></div><div class="kpi"><label>Scan afgerond</label><strong>19<span style="font-size:16px;color:#8cbecc"> / 23</span></strong><small>82% van de klas</small></div><div class="kpi"><label>Gem. kennisscan</label><strong>6,2<span style="font-size:16px;color:#8cbecc"> / 8</span></strong><small>Diagnostisch · geen cijfer</small></div></div><div class="cols"><div>${panel(`<div class="cardhead"><div><div class="eyebrow">ACTIEVE LES</div><h2>Energie in Frankrijk</h2></div><span class="tag">${state.klas}</span></div><p>Kies een fase om het klassikale lesverloop te demonstreren. In de uiteindelijke versie ziet de leerling automatisch de vrijgegeven fase.</p>${phaseButtons()}<div class="flex" style="margin-top:20px">${btn('← Vorige fase','setPhase(state.phase-1)','secondary sm')}${btn('Volgende fase →','setPhase(state.phase+1)','sm')}${btn('Leerlingvoorbeeld','setView("student")','ghost sm')}</div>`,'highlight')}<div style="height:17px"></div>${panel(`<div class="cardhead"><h2>Lesbibliotheek</h2><span class="tag">Herbruikbare opbouw</span></div>${lessonRows()}<div class="flex" style="margin-top:16px">${btn('＋ Nieuwe les','toast("In het uiteindelijke platform maakt de AK Lesbouwer hier een nieuwe les")','secondary sm')}</div>`)}</div><div>${panel(`<div class="cardhead"><h2>Live leerlingen</h2><span class="tag">DEMO</span></div><p class="small">Persoonlijke kennishiaten uit de fictieve Scan.</p><div style="margin-top:14px">${pupils.map(s=>`<div class="student"><div class="monogram">${safe(s.name[0])}</div><div><strong>${safe(s.name)}</strong><small>Extra hulp: ${safe(s.topic)}</small></div><span class="num">${s.score}/8</span></div>`).join('')}</div><p class="small">+17 andere fictieve leerlingen</p>`) }<div style="height:17px"></div>${panel(`<div class="cardhead"><h2>Challenge-bediening</h2><span class="tag">LEVELS</span></div><div class="eyebrow" style="margin-bottom:10px">SPELMODUS</div><div class="toggle"><button class="${state.mode==='duo'?'sel':''}" onclick="state.mode='duo';render()">Duo</button><button class="${state.mode==='solo'?'sel':''}" onclick="state.mode='solo';render()">Solo</button></div><p class="small" style="margin:12px 0">${state.mode==='duo'?'Leerlingen worden gekoppeld op aanvullende sterke punten.':'Iedere leerling speelt individueel.'}</p><div class="flex">${btn(state.teamsMade?'Maak indeling opnieuw':'Maak duo-indeling','state.teamsMade=true;render();toast("Fictieve duo-indeling gemaakt")','sm')}${btn(state.teamsPublished?'Teams zichtbaar ✓':'Onthul teams','state.teamsPublished=true;render()','secondary sm')}</div>${state.teamsMade?`<div style="margin-top:12px" class="small muted">Team 1: Noor + Milan<br>Team 2: Samira + Daan<br>Team 3: Liv + Youssef<br>… 7 overige duo's en 1 drietal</div>`:''}<div class="gamegrid" style="margin-top:15px"><div class="level"><strong>100</strong><span>Level 1</span></div><div class="level current"><strong>200</strong><span>Level 2</span></div><div class="level"><strong>300</strong><span>Level 3</span></div></div><div class="flex" style="margin-top:12px">${btn(state.winner?'Winnaar onthuld':'🏆 Onthul winnaar','state.winner=true;render()','secondary sm')}</div>${state.winner?'<div class="feedback">🏆 Demo-winnaar: Team 1 — 1.840 punten!</div>':''}`) }</div></div>`}
function board(){return `<div class="intro"><div><div class="eyebrow">DIGIBORD · PRESENTATIEWEERGAVE</div><h1>Jouw les, centraal op het bord</h1><p>Bedien de les voor de hele klas. De docent bepaalt wanneer de volgende fase zichtbaar wordt.</p></div><div class="flex">${btn('⛶ Volledig scherm','document.documentElement.requestFullscreen?.()','secondary')}${btn('Naar docentportaal','setView("teacher")','ghost')}</div></div><div class="board"><div class="boardTile big light"><div class="space"><span class="eyebrow">NU AAN HET WERK · ${state.klas}</span><span class="tag">FASE ${state.phase+1} / 6</span></div><div class="preview" style="margin-top:18px;min-height:260px"><div class="center"><div style="font-size:47px;color:var(--aqua);margin-bottom:8px">${phases[state.phase].icon}</div><div class="eyebrow">ENERGIE IN FRANKRIJK</div></div><h1 class="bigtitle">${phases[state.phase].name}</h1><p class="center">${phases[state.phase].sub}</p><div class="flex" style="justify-content:center;margin-top:10px"><span class="tag">23 leerlingen</span><span class="tag">${state.klas}</span></div></div><div class="flex" style="margin-top:16px">${btn('← Vorige','setPhase(state.phase-1)','secondary sm')}${btn('Volgende fase →','setPhase(state.phase+1)','sm')}</div></div><div class="boardTile"><div class="space"><h3>Lesklok</h3><span class="tag">HANDMATIGE DEMO</span></div><div class="clock center" id="clock" style="margin:20px 0">${fmt(state.clock)}</div><div class="flex" style="justify-content:center">${btn(state.clockRunning?'⏸ Pauze':'▶ Start','state.clockRunning=!state.clockRunning;render()','sm')}${btn('↻ Reset','state.clock=420;state.clockRunning=false;render()','secondary sm')}</div><div class="flex" style="justify-content:center;margin-top:12px">${btn('−1 min','state.clock=Math.max(0,state.clock-60);render()','ghost sm')}${btn('+1 min','state.clock+=60;render()','ghost sm')}</div></div><div class="boardTile"><h3>Lesvoortgang</h3><p class="small" style="margin:6px 0 16px">Fictieve actuele voortgang</p><div class="progress"><span style="width:${Math.round((state.phase+1)/6*100)}%"></span></div><div class="space" style="margin-top:11px"><span class="small muted">Lesfase ${state.phase+1} van 6</span><b>${Math.round((state.phase+1)/6*100)}%</b></div><div class="space" style="margin-top:17px"><span class="small muted">Leerlingen verbonden</span><strong>23 / 23</strong></div></div></div><div class="bodygrid"><div class="card"><div class="cardhead"><h2>Opdracht voor de klas</h2><span class="tag">Projectie</span></div><p style="color:#e5f6fb;font-size:17px">${['Maak de Scan zelfstandig. Kies het antwoord dat jij het beste vindt.','Lees je persoonlijke uitleg en beantwoord de oefenvraag.','Overleg met je duo of speel solo. Verzamel samen punten!','Bekijk de nieuwe bron en ontdek wat dit betekent voor Frankrijk.','Voltooi je eindmissie zelfstandig en laat zien wat je hebt geleerd.','Wat heb je geleerd? Wat blijft lastig? Kies je volgende lesstart.'][state.phase]}</p></div><div class="card"><div class="cardhead"><h2>Klaar? Extra uitdaging</h2><span class="tag">WACHTTAAK</span></div><p style="color:#d9f5f0">${tasks[state.phase]}</p></div></div>`}
function fmt(sec){let m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function answer(i){const q=questions[state.studentQuestion%questions.length];state.answers['scan'+state.studentQuestion]=i;state.picked=i;render();}
function nextQuestion(){state.studentQuestion=(state.studentQuestion+1)%questions.length;state.picked=state.answers['scan'+state.studentQuestion]??null;render()}
function changeStudentPhase(i){state.studentPhase=i;state.studentQuestion=0;state.picked=null;render()}
function studentContent(){const i=state.studentPhase;let s='';if(i===0){let q=questions[state.studentQuestion%questions.length];let picked=state.picked; s=`<div class="eyebrow">DIAGNOSTISCHE SCAN · VRAAG ${state.studentQuestion+1} / ${questions.length}</div><h2 style="margin:12px 0">${q.q}</h2><p class="small">Je krijgt nog geen cijfer. We gebruiken je antwoorden om de Kennisboost op maat te maken.</p><div style="margin-top:19px">${q.a.map((a,j)=>`<button class="choice ${picked===j?'chosen':''}" onclick="answer(${j})"><span style="color:var(--aqua);font-weight:800;margin-right:11px">${'ABC'[j]}</span>${a}</button>`).join('')}</div>${picked!==null?`<div class="feedback ${picked===q.ok?'':'bad'}"><b>${picked===q.ok?'✓ Goed gezien!':'✦ Hier gaan we straks mee oefenen'}</b><div style="margin-top:6px">${q.why}</div></div>`:''}<div class="space" style="margin-top:20px"><span class="small muted">${state.studentQuestion+1} van ${questions.length}</span>${btn(state.studentQuestion===questions.length-1?'Naar Kennisboost →':'Volgende vraag →',state.studentQuestion===questions.length-1?'changeStudentPhase(1)':'nextQuestion()', 'sm')}</div>`}else if(i===1){const q=questions.find(q=>state.answers['scan'+questions.indexOf(q)]!==q.ok)||questions[1];s=`<div class="eyebrow">PERSOONLIJKE LEERROUTE · OP MAAT</div><h2 style="margin:12px 0">Jouw Kennisboost: ${q.topic}</h2><p>Op basis van je Scan krijg jij extra uitleg over dit onderwerp. Andere leerlingen kunnen een andere boost krijgen.</p><div class="preview" style="min-height:130px;margin-top:18px;text-align:center"><div style="font-size:48px">${q.topic==='Kernenergie'?'⚛️':q.topic==='Waterkracht'?'💧':'🌍'}</div><h3>${q.topic}</h3><p style="color:#d6e9ef">${q.why}</p></div><h3 style="margin:20px 0 10px">Probeer nu een nieuwe vraag</h3><p style="color:#e1f1f7">Een stad heeft een waterkrachtcentrale. Welke energieomzetting vindt er plaats?</p>${['Bewegend water → turbine → generator → elektriciteit','Elektriciteit → water → uranium','Zonlicht → koeltoren → wind'].map((a,j)=>`<button class="choice ${state.boostStep===j+1?'chosen':''}" onclick="state.boostStep=${j+1};render()">${a}</button>`).join('')}${state.boostStep?`<div class="feedback ${state.boostStep===1?'':'bad'}">${state.boostStep===1?'✓ Je past het begrip goed toe!':'Nog niet helemaal. De beweging van water laat de turbine draaien; de generator maakt elektriciteit.'}</div>`:''}`}
else if(i===2){s=`<div class="eyebrow">SPEL · ${state.mode==='duo'?'DUO':'SOLO'} CHALLENGE</div><h2 style="margin:11px 0">Drie levels. Eén missie.</h2><p>Verdien punten door kennis toe te passen. In duo-modus levert goed samenwerken bonuspunten op.</p><div class="gamegrid" style="margin:18px 0"><div class="level"><strong>100</strong><span>Level 1 · Basis</span></div><div class="level current"><strong>200</strong><span>Level 2 · Toepassen</span></div><div class="level"><strong>300</strong><span>Level 3 · Expert</span></div></div><div class="card" style="background:#112c40;border-color:#43768b"><div class="space"><h3>⚡ Energiechallenge</h3><span class="tag">+200 PUNTEN</span></div><p style="margin:14px 0;color:white">Waarom heeft Frankrijk naast kerncentrales ook wind- en waterkracht nodig?</p>${['Voor een gevarieerde energievoorziening en minder afhankelijkheid van één bron.','Omdat kerncentrales alleen bij wind werken.','Omdat waterkracht uranium kan aanmaken.'].map((a,j)=>`<button class="choice ${state.picked===j?'chosen':''}" onclick="state.picked=${j};render()">${a}</button>`).join('')}${state.picked!==null?`<div class="feedback ${state.picked===0?'':'bad'}">${state.picked===0?'✓ +200 punten! Goed toegepast.':'Probeer te denken aan de voordelen van een energiemix.'}</div>`:''}</div><p style="margin-top:12px" class="small">Demo: de puntenteller en antwoorden worden hier niet naar een server verzonden.</p>`}
else if(i===3){s=`<div class="eyebrow">NIEUWE INHOUD · BRON & ONTDEKKEN</div><h2 style="margin:12px 0">Kan Frankrijk volledig duurzaam worden?</h2><p>Je hebt al kennis over de energiemix. Nu voegen we iets nieuws toe: <b style="color:white">leveringszekerheid</b>.</p><div class="preview" style="margin-top:18px;min-height:175px"><div style="font-size:44px;text-align:center">☀️ &nbsp; 🌬️ &nbsp; ⚡ &nbsp; 🔋</div><h3 class="center">Wanneer leveren zon en wind minder elektriciteit?</h3><p class="center">Energieopslag en een gevarieerde energiemix helpen stroom beschikbaar te houden.</p></div><h3 style="margin:18px 0 8px">Denkvraag</h3><p style="color:#e9f7fc">Het is een koude, windstille avond in Parijs. Welke twee oplossingen kunnen helpen om toch voldoende stroom te leveren?</p><textarea class="form" style="width:100%;min-height:85px;margin-top:12px" placeholder="Schrijf je idee op..."></textarea>${btn('Bewaar concept','toast("Demo: jouw tekst is alleen zichtbaar in deze pagina")','secondary sm')}`}
else if(i===4){s=`<div class="eyebrow">EINDMISSIE · INDIVIDUEEL</div><h2 style="margin:12px 0">De energieadviseur van Frankrijk</h2><p>Laat zien wat je hebt geleerd. Dit is jouw eigen eindmissie, ook als je eerder met een duo speelde.</p><div class="preview" style="min-height:115px;margin-top:20px"><h3>🌍 De Franse regering vraagt advies</h3><p>Ontwerp een energiemix die betrouwbaar is en tegelijk rekening houdt met klimaat en milieu.</p></div><h3 style="margin:20px 0 10px">Vraag 1 — Jouw advies</h3><p style="color:#deedf5">Noem twee energiebronnen en leg uit waarom je deze combineert.</p><textarea class="form" id="missionText" style="width:100%;min-height:120px;margin-top:12px" placeholder="Mijn advies is..."></textarea><div style="margin-top:12px">${btn('Lever je eindmissie in','toast("Demo: de eindmissie is visueel ingeleverd; niet opgeslagen")','sm')}</div>`}
else{s=`<div class="eyebrow">TERUGBLIK & VOORUITBLIK</div><h2 style="margin:12px 0">Wat neem jij mee?</h2><p>Jouw mening helpt de volgende les beter te maken.</p><h3 style="margin:20px 0 12px">Hoe goed hielp deze les jou?</h3><div class="flex">${['😕','😐','🙂','😀','🤩'].map((x,i)=>btn(x,`toast('Demo: waardering ${i+1} van 5 gekozen')`,'secondary sm')).join('')}</div><h3 style="margin:24px 0 10px">Waar wil je de volgende les mee beginnen?</h3><div class="flex">${['Bronnenquiz','Klassengesprek','Korte uitleg','Mini-game'].map(x=>btn(x,`toast('Demo: ${x} gekozen')`,'secondary sm')).join('')}</div><h3 style="margin:24px 0 10px">Wat blijft nog lastig?</h3><textarea class="form" style="width:100%;min-height:80px" placeholder="Dit wil ik nog eens oefenen..."></textarea>`}
return s}
function student(){return `<div class="intro"><div><div class="eyebrow">LEERLINGOMGEVING · ${state.klas}</div><h1>Jouw aardrijkskundemissie</h1><p>Je krijgt persoonlijke hulp waar je die nodig hebt. Eén scherm, één leerroute.</p></div><span class="pill"><span class="dot"></span> VOORBEELDLEERLING</span></div><div class="cols"><div>${panel(`<div class="space"><div><div class="eyebrow">JOUW LES VAN VANDAAG</div><h2>Energie in Frankrijk</h2></div><span class="tag">FASE ${state.studentPhase+1} / 6</span></div><div class="progress" style="margin:15px 0"><span style="width:${(state.studentPhase+1)/6*100}%"></span></div><div style="margin-top:22px">${studentContent()}</div>`,'highlight')}</div><div>${panel(`<div class="cardhead"><h2>Mijn voortgang</h2><span class="tag">${state.klas}</span></div><div class="lessonList">${phases.map((p,i)=>`<button onclick="changeStudentPhase(${i})" class="phase ${i===state.studentPhase?'active':i<state.studentPhase?'done':''}" style="display:flex;flex-direction:row;align-items:center;text-align:left;gap:11px"><span class="num">${i<state.studentPhase?'✓':i+1}</span><span style="font-size:13px;font-weight:800">${p.name}</span></button>`).join('')}</div><p class="small" style="margin-top:16px">In de echte versie geeft de docent fasen vrij. Hier mag je klikken om alle schermen te bekijken.</p>`)}<div style="height:16px"></div>${panel(`<div class="cardhead"><h3>✦ Klaar? Minichallenge</h3></div><p>${tasks[state.studentPhase]}</p><div class="flex" style="margin-top:14px">${btn('Nog een opdracht','toast("Demo: nieuwe verdiepingsopdrachten komen uit de lesbibliotheek")','secondary sm')}</div>`)}<div style="height:16px"></div>${panel(`<div class="eyebrow">INLOGGEN · CONCEPT</div><h3 style="margin:8px 0">Eenvoudig deelnemen</h3><p class="small">In de echte online versie vullen leerlingen hun naam en een lescode in. Je hoeft geen HTML te downloaden.</p><div class="flex" style="margin-top:12px"><span class="tag">LESCODE: GFR-3TL</span></div>`)}</div></div>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.id==='nav-'+state.view));el('breadcrumb').textContent={teacher:'Docentportaal',board:'Digibord',student:'Leerlingomgeving'}[state.view];el('screen').innerHTML={teacher,board,student}[state.view]();document.title='GFR Learn Hub · '+el('breadcrumb').textContent}const allowed=['teacher','board','student'];const initial=window.location.hash.slice(1);state.view=allowed.includes(initial)?initial:'teacher';window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(allowed.includes(h)&&state.view!==h){state.view=h;render()}});setInterval(()=>{if(state.clockRunning&&state.clock>0){state.clock--;const c=el('clock');if(c)c.textContent=fmt(state.clock);if(state.clock===0){state.clockRunning=false;toast('De lestijd is voorbij')}}},1000);render();
</script></body></html>
