return panel(`<p class="eyebrow">WELKOM · EERST DE LESCODE</p><h1>De Grote Herhaalles</h1><p>Maak je klaar voor een reis langs de Franse kerncentrales, stuwdammen en duurzame energie. Je docent bepaalt wanneer de volgende ronde begint.</p><form id="studentLogin"><label>Lescode</label><input class="field" name="code" value="${CODE}" required><label>Voornaam of testnaam</label><input class="field" name="name" maxlength="40" placeholder="Bijvoorbeeld: Testleerling 2" required><button class="btn primary" type="submit">⚡ Deelnemen</button></form><p class="mini muted">Gebruik tijdens het testen alleen fictieve namen.</p>`)}
const stageTitles=['De Scan','Kennisboost','De Confrontatie','Herstel & Versterk','Het Eindduel','Missie Voltooid','Terugblik & Vooruitblik'];
function mine(){return data?.myAnswers||{}}
function saved(id){return mine()[id]?.value}
function topicMisses(){const arr=Object.keys(TOPICS).map(topic=>({topic,miss:QUESTIONS.filter(q=>q.topic===topic&&saved(q.id)!==0).length}));return arr.sort((a,b)=>b.miss-a.miss).map(x=>x.topic)}
function boostQuestions(){const topics=topicMisses();return topics.slice(0,4).map((topic,i)=>({...BOOST_BANK[topic][0],id:'b'+(i+1),topic,visual:TOPIC_LESSONS[topic]?.[2]}))}
function recoveryQuestions(){return topicMisses().slice(0,5).map((topic,i)=>({id:'r'+(i+1),topic,question:RECOVERY_PROMPTS[topic],visual:TOPIC_LESSONS[topic]?.[2],open:true}))}
function bank(phase){if(phase===0)return QUESTIONS;if(phase===1)return boostQuestions();if(phase===2)return CHALLENGES;if(phase===3)return recoveryQuestions();if(phase===4)return FINAL;if(phase===5)return [...EXIT,{id:'e4',open:true,question:'Leg in drie zinnen uit welke energiebronnen Frankrijk zou kunnen combineren en waarom.',topic:'mix'}];return []}
function questionBlock(q,phase){const answer=saved(q.id),has=answer!==undefined;
const mini=(phase===1||phase===3)?explainTopic(q.topic):q.visual?`<div class="visual">${visuals(q.visual)}</div>`:'';
let ui='';if(q.open){ui=`<textarea id="answerText" class="area" rows="5" ${has?'disabled':''} placeholder="Leg je antwoord uit in je eigen woorden">${has?esc(answer):''}</textarea>`}
else ui=`<div class="answers">${q.answers.map((v,i)=>`<button class="answer ${has&&answer===i?'chosen':''}" ${has?'disabled':''} data-choice="${i}"><b>${'ABCD'[i]}</b> ${esc(v)}</button>`).join('')}</div>`;
return `${panel(`<div class="space"><span class="eyebrow">${esc(stageTitles[phase]).toUpperCase()} · VRAAG ${questionIndex+1} / ${bank(phase).length}</span><span class="tag">${has?'✓ Opgeslagen':'Jouw antwoord'}</span></div><div style="height:7px;border-radius:20px;background:#194b60;margin:16px 0 24px"><div style="width:${Math.round((questionIndex+1)/bank(phase).length*100)}%;height:100%;border-radius:20px;background:#60dfe8"></div></div><h2>${esc(q.question)}</h2>${mini}${ui}<div class="space" style="margin-top:18px"><button class="btn" id="prevQ" ${questionIndex===0?'disabled':''}>← Vorige</button><div>${q.open&&!has?'<button class="btn primary" id="saveOpen">Bewaar antwoord ✓</button>':''} <button class="btn primary" id="nextQ" ${has?'':'disabled'}>${questionIndex===bank(phase).length-1?'Afronden ✓':'Volgende →'}</button></div></div>`)}`}
function waitBox(phase){return panel(`<div class="eyebrow">✓ KLAAR? DOE DIT TERWIJL JE WACHT</div><h2>Mini-uitdaging</h2><p>${esc(waitTasks[phase])}</p><p class="mini muted">Je docent bepaalt wanneer de volgende ronde start. Deze opdracht telt niet mee voor de punten.</p>`)}
function studentUI(){let phase=data.lesson.phase,arr=bank(phase),done=arr.length&&arr.every(q=>saved(q.id)!==undefined),team=data.lesson.state.teams?.find(t=>t.members?.includes(data.myId));
let head=`<div class="space"><div><div class="eyebrow">MISSIE: ENERGIE IN FRANKRIJK</div><h1 class="heading">${esc(stageTitles[phase])}</h1><p>${esc(STAGES[phase]?.desc||'')}</p></div><div class="tag">RONDE ${phase+1} / 7</div></div>`;
if(phase===2&&!team) return head+panel('<h2>👥 De duo-indeling komt eraan…</h2><p>Je docent vormt de duo’s op basis van de Kennisscan. Bekijk intussen de mini-uitdaging.</p>')+waitBox(phase);
if(phase===2&&team){head+=panel(`<h2>${esc(team.name)}</h2><p>Je team: ${data.students.filter(s=>team.members.includes(s.id)).map(s=>esc(s.name)).join(' + ')}</p>`)}
if(phase===6)return head+feedbackUI()+waitBox(phase);
if(done)return head+panel(`<div class="eyebrow" style="color:#83ebbd">✓ OPGESLAGEN</div><h2>Je hebt alle vragen van deze fase afgerond.</h2><p>Goed gedaan! Je antwoorden zijn veilig opgeslagen. Wacht op het volgende signaal van je docent.</p>`)+waitBox(phase);
return head+questionBlock(arr[Math.min(questionIndex,arr.length-1)],phase)+waitBox(phase)}
function feedbackUI(){return panel(`<p class="eyebrow">JOUW STEM TELT</p><h2>Hoe vond je deze les?</h2><p>Kies een waardering en hoe je het volgende hoofdstuk wilt beginnen.</p><div class="row" id="ratings">${[1,2,3,4,5].map(n=>`<button data-rate="${n}" class="btn ${feedRating===n?'primary':''}">${'★'.repeat(n)}</button>`).join('')}</div><label>Hoe wil je de volgende les beginnen?</label><select class="field" id="nextMode">${MODES.map(x=>`<option ${feedMode===x?'selected':''}>${esc(x)}</option>`).join('')}</select><label>Wat hielp je het meest?</label><select class="field" id="helpMode">${FEEDBACK_WHAT.map(x=>`<option>${esc(x)}</option>`).join('')}</select><button class="btn primary" id="sendFeedback">Verstuur mijn feedback ✓</button><div class="notice">De winnaar blijft verborgen tot de docent de onthulling start.</div>`)}
function scoreTable(){const groups=data.lesson.state.teams||[],reveal=!!data.lesson.state.winnerRevealed;const sums=groups.map(g=>({...g,score:g.members.reduce((a,id)=>a+(data.students.find(s=>s.id===id)?.points||0),0)})).sort((a,b)=>b.score-a.score);
return panel(`<h2>🏆 ${reveal?'De winnaar is onthuld!':'De Grote Onthulling'}</h2>${reveal?`<div class="eyebrow">🥇 WINNAAR · ${esc(sums[0]?.name||'–')}</div><h2>${sums[0]?.score??0} punten</h2><ol>${sums.map(s=>`<li>${esc(s.name)} · ${s.score} p</li>`).join('')}</ol>`:'<div class="notice">De einduitslag blijft geheim totdat jij hem na de afsluiting onthult.</div>'}<button id="revealWinner" class="btn primary" ${data.lesson.phase!==6?'disabled':''}>🏆 Onthul de winnaar</button>`)}
function teacherUI(){const phase=data.lesson.phase,students=data.students,answers=data.answers,teams=data.lesson.state.teams||[],done=students.filter(s=>(phase===0?s.scanDone:bank(phase).length&&bank(phase).every(q=>answers.some(a=>a.student_id===s.id&&a.question===q.id)))).length;
const cards=`<div class="kpis"><div class="kpi"><strong>${students.length}</strong><span>Leerlingen</span></div><div class="kpi"><strong>${done}</strong><span>Deze fase klaar</span></div><div class="kpi"><strong>${teams.length}</strong><span>Duo's / trio's</span></div><div class="kpi"><strong>${students.length?Math.round(students.reduce((x,s)=>x+(s.scanScore||0),0)/students.length/8*100):0}%</strong><span>Gem. Kennisscan</span></div></div>`;
let controls=panel(`<p class="eyebrow">DOCENT · 7 FASEN</p><h2>${esc(stageTitles[phase])}</h2><div class="row" style="flex-wrap:wrap;gap:8px">${stageTitles.map((s,i)=>`<button class="btn small ${i===phase?'primary':''}" data-phase="${i}">${i+1}. ${esc(s)}</button>`).join('')}</div><div class="row" style="margin-top:14px;gap:8px;flex-wrap:wrap"><button class="btn" id="previousStage" ${phase===0?'disabled':''}>← Vorige fase</button><button class="btn primary" id="nextStage" ${phase===6?'disabled':''}>Volgende fase →</button><button class="btn" id="signout">Uitloggen</button></div><label style="display:block;margin-top:16px"><input type="checkbox" id="emergency" ${data.lesson.state.emergency?'checked':''}> Tijdnoodmodus (verkorte opdrachten)</label>`);
let teamPanel=panel(`<h2>⚖ Duo-indeling</h2><p>Automatisch sterk met minder sterk combineren; bij een oneven aantal leerlingen wordt een trio gevormd.</p><button id="makeTeams" class="btn primary">Automatische duo-indeling</button> <button id="publishTeams" class="btn">${data.lesson.state.publishedTeams?'Verberg teams':'Teams onthullen'}</button><div>${teams.map(t=>`<div class="team"><strong>${esc(t.name)}</strong><p>${t.members.map(id=>esc(students.find(s=>s.id===id)?.name||'?')).join(' + ')}</p></div>`).join('')}</div>`);
const table=panel(`<h2>👥 Leerlingen & voortgang</h2><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th>Leerling</th><th>Scan</th><th>Deze fase</th><th>Status</th></tr></thead><tbody>${students.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.scanScore}/8</td><td>${answers.filter(a=>a.student_id===s.id&&a.phase===phase+1).length}/${phase===6?'–':bank(phase).length}</td><td>${s.scanDone?'Scan ✓':'Bezig'}</td></tr>`).join('')}</tbody></table></div><p class="mini muted">Verversing iedere 5 seconden · lescode ${CODE}</p>`);
const openAnswers=answers.filter(a=>['f10','f11','f12'].includes(a.question));
const grading=panel(`<h2>✍ Open antwoorden beoordelen</h2>${openAnswers.length?openAnswers.map(a=>`<div class="studentCard"><strong>${esc(a.student)} · ${esc(a.question.toUpperCase())}</strong><p>${esc(a.answer)}</p><div class="row">${[0,100,200,300].map(p=>`<button class="btn small" data-grade="${p}" data-student="${a.student_id}" data-question="${a.question}">${p} p</button>`).join('')}</div></div>`).join(''):'<p>Open antwoorden uit de finale verschijnen hier zodra leerlingen ze insturen.</p>'}`);
return `<div class="space"><div><div class="eyebrow">GEO FUTURE ROUTE · DOCENTENDASHBOARD</div><h1 class="heading">De Grote Herhaalles</h1></div><span class="tag">LIVE · ${CODE}</span></div>${cards}${controls}${phase>=2?teamPanel:''}${table}${grading}${phase===6?scoreTable():''}`}
function bind(){if($('studentLogin'))$('studentLogin').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;const b=f.querySelector('button');b.disabled=true;status('Je wordt aangemeld…');try{const {data:{session}}=await db.auth.getSession();if(!session){const{error}=await db.auth.signInAnonymously();if(error)throw error}await api('join_energy_lesson',{p_code:f.elements.namedItem('code').value,p_name:f.elements.namedItem('name').value});player=true;await refresh(true)}catch(err){status('Aanmelden: '+err.message,true)}finally{b.disabled=false}};
if($('teacherLogin'))$('teacherLogin').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;try{const{error}=await db.auth.signInWithPassword({email:f.elements.namedItem('email').value,password:f.elements.namedItem('password').value});if(error)throw error;f.elements.namedItem('password').value='';await refresh(true)}catch(err){status('Inloggen: '+err.message,true)}};
if($('signout'))$('signout').onclick=async()=>{await db.auth.signOut();data=null;frame(screenLogin());bind()};
if($('prevQ'))$('prevQ').onclick=()=>{questionIndex=Math.max(0,questionIndex-1);render()};
if($('nextQ'))$('nextQ').onclick=()=>{const qs=bank(data.lesson.phase);questionIndex=Math.min(qs.length-1,questionIndex+1);render()};
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=async()=>{const qs=bank(data.lesson.phase);const q=qs[questionIndex],a=+b.dataset.choice;await submit(q,a)});
if($('saveOpen'))$('saveOpen').onclick=async()=>{const q=bank(data.lesson.phase)[questionIndex],v=$('answerText').value.trim();if(v.length<2)return status('Schrijf een kort antwoord.',true);await submit(q,v)};
if($('nextStage'))$('nextStage').onclick=()=>patch({phase:Math.min(6,data.lesson.phase+1),winnerRevealed:false});if($('previousStage'))$('previousStage').onclick=()=>patch({phase:Math.max(0,data.lesson.phase-1)});
document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>patch({phase:+b.dataset.phase}));if($('emergency'))$('emergency').onchange=e=>patch({emergency:e.target.checked});
if($('makeTeams'))$('makeTeams').onclick=makeTeams;if($('publishTeams'))$('publishTeams').onclick=()=>patch({publishedTeams:!data.lesson.state.publishedTeams});
if($('revealWinner'))$('revealWinner').onclick=async()=>{if(!confirm('Weet je zeker dat je de winnaar nu wilt onthullen?'))return;await patch({winnerRevealed:true})};
document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=async()=>{try{await api('energy_live_grade',{p_code:CODE,p_student:b.dataset.student,p_question:b.dataset.question,p_points:+b.dataset.grade});status('Punten toegekend');await refresh(true)}catch(err){status(err.message,true)}});
document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{feedRating=+b.dataset.rate;render()});if($('nextMode'))$('nextMode').onchange=e=>feedMode=e.target.value;
if($('sendFeedback'))$('sendFeedback').onclick=async()=>{try{await api('energy_live_send_feedback',{p_code:CODE,p_rating:feedRating,p_next:$('nextMode').value,p_help:$('helpMode').value});status('Bedankt! Je feedback is opgeslagen.');$('sendFeedback').disabled=true}catch(err){status(err.message,true)}};
}
async function submit(q,v){if(updating)return;updating=true;const phase=data.lesson.phase;status('Antwoord veilig opslaan…');try{await api('energy_live_submit',{p_code:CODE,p_question:q.id,p_answer:v});await refresh(true);const qs=bank(phase);if(data.lesson.phase===phase&&questionIndex<qs.length-1)questionIndex++;render();status('✓ Antwoord opgeslagen')}catch(err){status('Opslaan mislukt: '+err.message,true)}finally{updating=false}}
async function patch(p){try{await api('energy_live_teacher_set',{p_code:CODE,p_patch:p});await refresh(true);status('✓ Wijziging bij alle apparaten opgeslagen')}catch(err){status('Wijzigen mislukt: '+err.message,true)}}
async function makeTeams(){const students=data.students.filter(s=>s.scanDone).sort((a,b)=>(b.scanScore||0)-(a.scanScore||0));if(students.length<2)return status('Eerst minimaal twee leerlingen de Scan laten afronden.',true);
const n=Math.floor(students.length/2),pairs=[];for(let i=0;i<n;i++)pairs.push([students[i].id,students[students.length-1-i].id]);if(students.length%2){const mid=students[n].id;pairs[0].push(mid)}const teams=pairs.map((members,i)=>({name:members.length===3?'Trio '+(i+1):'Duo '+(i+1),members}));await patch({teams,publishedTeams:false});}
async function refresh(force=false){if(updating&&!force)return;try{const s=await db.auth.getSession();if(!s.data.session){if(data||first){data=null;first=false;frame(screenLogin());bind()}return}
const fresh=await api('energy_live_fetch',{p_code:CODE});if(view==='teacher'&&!fresh.isTeacher){data=null;frame(panel('<h2>Geen toegang</h2><p>Log in met een gemachtigd docentaccount.</p><button class="btn" id="switchAccount">Ander account</button>'));$('switchAccount').onclick=async()=>{await db.auth.signOut();data=null;refresh(true)};return}
if(view==='student'&&!fresh.myId){data=null;if(first||force){frame(screenLogin());bind()}first=false;return}
const was=data?.lesson.phase;data=fresh;first=false;if(was!==undefined&&was!==data.lesson.phase)questionIndex=0;
if(!updating||force)render();}catch(err){if(first||force){frame(screenLogin());bind()}status('Verbinding: '+err.message,true);first=false}}
function render(){if(!data){frame(screenLogin());bind();return}let body=view==='teacher'?teacherUI():studentUI();frame(body);bind();}
window.addEventListener('hashchange',()=>{view=location.hash==='#docent'?'teacher':'student';data=null;first=true;refresh(true)});
if(db){refresh(true);tick=setInterval(()=>refresh(false),5000)}else{document.getElementById('app').innerHTML='<main style="max-width:720px;margin:10vh auto;background:#103347;border:1px solid #32667c;color:#fff;padding:30px;border-radius:18px;font-family:system-ui"><h1>⚡ V10 LIVE kon niet starten</h1><p>De verbinding met de benodigde bibliotheek is geblokkeerd of nog niet geladen. Probeer Ctrl + F5, of open de site in Chrome.</p><button onclick="location.reload()" style="padding:12px 20px;cursor:pointer">Probeer opnieuw</button><p><a style="color:#73e2e9" href="kennisscan.html">Open de werkende Kennisscan als reserve</a></p></main>';}

</script></body></html>
