function boostList(s){let missed=topicPerf(s).sort((a,b)=>(a.correct/a.done)-(b.correct/b.done)).map(x=>x.topic);let out=[];for(const t of missed){let source=BOOST_BANK[t];out.push({...source[0],topic:t,id:'b_'+t+'0'});if(out.length===4)break;}if(score(s)==QUESTIONS.length){out=[{id:'b_mix0',topic:'mix',...BOOST_BANK.mix[0]},{id:'b_sustain0',topic:'sustain',...BOOST_BANK.sustain[0]},{id:'b_nuclear1',topic:'nuclear',...BOOST_BANK.nuclear[1]},{id:'b_water1',topic:'water',...BOOST_BANK.water[1]}]};return out}

function teamPoints(t){return t.members.reduce((n,id)=>{const s=store.students.find(x=>x.id===id);return n+(s?score(s,'duo')*80+finalPoints(s):0)},0)}

ulpmiddelen</h3><button class="btn small" data-act="openStudent">Open aparte leerlingtab</button><button class="btn small ghost" data-act="addDemo">+ 8 demo-leerlingen</button><div class="separator"></div><button class="btn small warn" data-act="resetData">Wis testgegevens</button></section></aside><main class="stack"><div class="kpis"><div class="kpi"><strong>${total}</strong><span>Leerlingen</span></div><div class="kpi"><strong>${done}</strong><span>Deze fase klaar</span></div><div class="kpi"><strong>${store.teams.length}</strong><span>Teams</span></div><div class="kpi"><strong>${total?Math.round(store.students.reduce((a,s)=>a+score(s),0)/(total*QUESTIONS.length)*100):0}%</strong><span>Gem. kennisscan</span></div></div><section class="panel"><div class="space"><h2>Wat gebeurt er nu?</h2><span class="tag">DOCENTENSCHERM</span></div>${teacherPhaseContent()}</section><div class="grid2"><section class="panel"><h2>👥 Leerlingen & voortgang</h2><div id="people">${total?store.students.map(s=>`<div class="person"><div><strong>${esc(s.name)}</strong><span>${s.scanDone?score(s)+'/8':'bezig'}</span></div><small>${s.scanDone?'Scan klaar':'Scan nog niet afgerond'} · ${s.hw==='all'?'Huiswerk af':s.hw==='some'?'Huiswerk deels':s.hw==='none'?'Geen huiswerk':'Huiswerk onbekend'} · Boost ${s.scanDone&&boostDone(s)?'klaar':'–'} · Quiz ${s.duo?Object.keys(s.duo).length:0}/8</small></div>`).join(''):'<p class="muted">Er zijn nog geen leerlingen. Open een leerlingtab en meld een testleerling aan.</p>'}</div></section><section class="panel"><h2>🏆 ${store.phase>=6?'Grote winnaarsonthulling':'Teams en scores'}</h2>${store.phase>=6?`<div class="notice">De eindscore blijft verborgen tot jij onthult.</div><button class="btn primary" data-act="winner">${store.winnerRevealed?'🏆 Toon podium opnieuw':'🏆 Onthul de winnaar'}</button>`:''}${store.teams.length?store.teams.map(t=>`<div class="team"><div class="space"><strong>${esc(t.name)}</strong><span class="score">${store.phase>=5&&!store.winnerRe function teacherPhaseContent(){const p=store.phase;

if(p===3)return `<p>5 minuten rustig werken: leerlingen kiezen waar ze nog moeite mee hebben of krijgen automatisch een vervolgvraag over hun zwakste onderwerp.</p><div class="notice">Bij tijdnood mag je deze ronde inkorten of overslaan.</div>`;
if(p===4)return `<p>Het Eindduel: 12 nieuwe vragen, waarvan 3 open. Meerkeuze: 100, 200 en 300 punten. Open antwoorden: docent kent handmatig maximaal 300 punten toe. De winnaar blijft geheim.</p>${teacherOpenGrading()}`;
if(p===5)return `<p>Individuele eindcheck: drie korte vragen gekoppeld aan de lesdoelen. Geen overleg en geen AI. De teamresultaten blijven geheim tot de grote onthulling.</p><div class="grid3">${['Energiemix verklaren','Kernenergie beoordelen','GFR toepassen'].map((x,i)=>`<div class="cardwhite"><b>${x}</b><div class="space"><span class="mini">Goed beantwoord</span><strong>${store.students.filter(s=>s.exit?.[EXIT[i].id]===EXIT[i].correct).length}/${store.students.length}</strong></div></div>`).join('')}</div>`;
let finished=store.students.filter(s=>s.feedback);let counts=MODES.map((m,i)=>({name:m,n:finished.filter(s=>s.feedback?.mode===i).length}));return `<h2>De leerlingstem · voorbereiding volgende hoofdstuk</h2><p>Live overzicht van waardering en hoe leerlingen het nieuwe hoofdstuk willen beginnen.</p><div class="space"><b>${finished.length} van ${store.students.length} reacties</b><span class="tag">ALLEEN DOCENT</span></div><h3 style="margin-top:16px">Hoe vonden ze deze les?</h3><div class="grid2">${RATINGS.map((r,i)=>`<div class="cardwhite"><span>${r}</span><strong style="float:right">${finished.filter(s=>s.feedback?.rating===i).length}</strong></div>`).join('')}</div><h3 style="margin-top:19px">Zo willen ze de volgende les starten</h3>${counts.map(x=>`<div class="poll"><label><span>${esc(x.name)}</span><strong>${x.n}</strong></label><div class="bar"><span style="width:${finished.length?100*x.n/finished.length:0}%"></span></div></div>`).join('')}<p class="notice">${finished.length?`Meest gekozen: ${esc(counts.slice().sort((a,b)=>b.n-a.n)[0].name)}.`:'Reacties verschijnen hier terwijl leerlingen afsluiten.'}</p><button class="btn small" data-act="export">⬇ Download feedback (CSV)</button>`}

function scanView(s){if(s.scanDone)return `<div class="studentCard"><span class="eyebrow">Goed gedaan</span><h2>✓ Kennisscan afgerond</h2><p>Je hebt 8 antwoorden ingeleverd. We gebruiken je antwoorden om straks gericht te oefenen. Je score en antwoorden blijven voorlopig verborgen.</p><div class="notice">Wacht tot de docent de Kennisboost start.</div></div>`;let q=QUESTIONS[qpos]||QUESTIONS[0];let answered=QUESTIONS.filter(x=>s.scan?.[x.id]!==undefined).length;return `<div class="space"><b>Vraag ${qpos+1} van 8</b><span class="tag">STILTE · GEEN AI OF BOEK</span></div><div class="progressbar" style="margin:9px 0 17px"><div style="width:${answered/8*100}%"></div></div>${qpos===0?`<div class="studentCard" style="margin-bottom:12px"><label class="label">Heb je Finish en Extra in Learnbeat gemaakt?</label><select class="field" id="hw"><option value="unknown">Kies een antwoord</option><option value="all" ${s.hw==='all'?'selected':''}>Ja, allebei</option><option value="some" ${s.hw==='some'?'selected':''}>Een gedeelte</option><option value="none" ${s.hw==='none'?'selected':''}>Nee</option></select><p class="mini">Alleen de docent ziet dit. Het bepaalt niet op zichzelf je niveau.</p></div>`:''}${answerUI(q,s,'scan')}<div class="studentControls"><button class="btn" data-act="scanPrev" ${qpos===0?'disabled':''}>← Vorige</button>${qpos===7?`<button class="btn primary" data-act="scanSubmit" ${answered!==8?'disabled':''}>Lever scan in →</button>`:`<button class="btn primary" data-act="scanNext">Volgende vraag →</button>`}</div>`}
function boostView(s){if(!s.scanDone)return `<div class="studentCard"><h2>Maak eerst de Kennisscan af</h2><p>De docent kan je nog even terugzetten naar de eerste ronde.</p></div>`;let qs=boostList(s),q=qs[bpos]||qs[0],picked=s.boost?.[q.id];let issues=topicPerf(s).filter(t=>t.correct<t.done);return `<div class="studentCard" style="margin-bottom:14px"><span class="eyebrow">JOUW KENNISPROFIEL · ${score(s)}/8</span><h2>Dit wist je al. Dit kun je versterken.</h2><p>${issues.length?`Je hebt nog oefenkansen bij: <b>${issues.map(x=>TOPICS[x.topic]).join(', ')}</b>.`:'Je had de volledige scan goed! Je krijgt extra toepassingsvragen.'}</p><details><summary style="cursor:pointer;font-weight:800">Bekijk uitleg van mijn 8 scanvragen</summary>${QUESTIONS.map(x=>`<div class="topic"><b>${esc(TOPICS[x.topic])}: ${s.scan?.[x.id]===x.correct?'✓ goed':'↻ oefenen'}</b><p>${esc(x.question)}</p><p><strong>Juiste antwoord:</strong> ${esc(x.answers[x.correct])}</p><p>${esc(x.explain)}</p><div class="visual">${visuals(TOPIC_LESSONS[x.topic]?.[2]||'france')}</div></div>`).join('')}</details></div><div class="space"><b>Gericht oefenen · vraag ${bpos+1} van ${qs.length}</b><span class="tag">PERSOONLIJK</span></div>${explainTopic(q.topic)}${answerUI(q,s,'boost',picked!==undefined)}<div class="studentControls"><button class="btn" data-act="boostPrev" ${bpos===0?'disabled':''}>← Vorige</button>${bpos===qs.length-1?`<button class="btn primary" data-act="boostDone" ${!boostDone(s)?'disabled':''}>Kennisboost afronden ✓</button>`:`<button class="btn primary" data-act="boostNext">Volgende →</button>`}</div>${boostDone(s)?'<div class="notice good">✓ Je hebt alle boostvragen beantwoord. Wacht op de duo-indeling.</div>':''}`}
function duoView(s){let t=teamFor(s.id);if(!store.publishedTeams||!t)return `<div class="studentCard"><h2>De duo-indeling komt eraan…</h2><p>De docent maakt teams op basis van jullie verschillende sterke kanten. Wacht op de onthulling op het bord.</p><div class="notice">Iedereen neemt kennis mee; het gaat om wat jullie samen weten.</div></div>`;return `<div class="studentCard" style="margin-bottom:14px"><span class="eyebrow">JULLIE TEAM</span><h2>${esc(t.name)}</h2><p>${t.members.map(id=>esc(store.students.find(x=>x.id===id)?.name||'?')).join(' + ')}</p><div class="notice"><b>Overleg met elkaar.</b> Ieder vult op de eigen laptop een antwoord in. Voor elk goed antwoord ontvangt jullie team punten.</div></div>${quizView(s,'duo',CHALLENGES,duopos,'Duoquiz',80)}`}

const RECOVERY_PROMPTS={"mix": "Leg het verschil uit tussen in Frankrijk opgewekte elektriciteit en ingevoerde brandstof.", "nuclear": "Leg in drie stappen uit hoe een kerncentrale stroom maakt. Noem ook een risico.", "water": "Waarom zijn het reliëf en de neerslag belangrijk voor een stuwdam?", "sustain": "Waarom is een wijk met alleen zonnepanelen kwetsbaar? Bedenk twee oplossingen.", "transport": "Beschrijf de reis van LNG van een aardgasveld naar een Frans huishouden."};
function workView(s){
 const weak=topicPerf(s).sort((a,b)=>a.correct/a.done-b.correct/b.done)[0];
 const topics=[weak.topic,...Object.keys(TOPICS).filter(t=>t!==weak.topic)].slice(0,store.emergency?2:5);
 const items=topics.map((topic,i)=>`<div class="studentCard" style="margin-bottom:12px"><span class="eyebrow">OEFENOPDRACHT ${i+1} · ${esc(TOPICS[topic])}</span>${explainTopic(topic)}<p><strong>${esc(RECOVERY_PROMPTS[topic])}</strong></p><textarea class="area recovery-input" data-topic="${topic}" placeholder="Schrijf je uitleg met minstens één oorzaak of gevolg">${esc(s.workAnswers?.[topic]||'')}</textarea></div>`).join('');
 return `<div class="studentCard"><span class="eyebrow">HERSTEL & VERSTERK · ${topics.length} VRAGEN</span><h2>Werk eerst aan jouw zwakste onderwerp</h2><p>Leg je antwoorden zo uit dat een klasgenoot het begrijpt. Begin met <b>${esc(TOPICS[weak.topic])}</b>.</p>${items}<button class="btn primary" data-act="saveWork">Bewaar mijn 5 uitwerkingen ✓</button><div class="notice">${s.work?'✓ Je hebt eerder uitwerkingen opgeslagen.':'Tip: ben je vroeg klaar? Maak de mini-opdracht onderaan.'}</div></div>`;
}
function feedbackView(s){if(s.feedback)return `<div class="studentCard"><h2>Bedankt voor je feedback! 🙌</h2><p>Jouw docent ziet alle reacties terug op het afsluitende dashboard en gebruikt die bij de voorbereiding van het nieuwe hoofdstuk.</p><div class="notice good">Je hebt alle rondes afgerond.</div></div>`;return `<div class="studentCard"><span class="eyebrow">5 MINUTEN · JOUW STEM</span><h2>Hoe vond jij deze les?</h2><p>Klik op één antwoord. Het is geen cijfer voor jou.</p><div class="grid2" id="ratingOptions">${RATINGS.map((r,i)=>`<button class="answer" data-rating="${i}">${r}</button>`).join('')}</div><h2 style="margin-top:24px">Hoe wil je het nieuwe hoofdstuk starten?</h2><p>Kies de werkvorm waar jij het meest van verwacht.</p><div class="grid2" id="modeOptions">${MODES.map((m,i)=>`<button class="answer" data-mode="${i}">${esc(m)}</button>`).join('')}</div><h2>Wat hielp jou het meest?</h2><select id="feedbackWhat" class="field">${FEEDBACK_WHAT.map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join('')}</select><h2>Wat vind je nog lastig?</h2><select id="feedbackTopic" class="field">${FEEDBACK_TOPIC.map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join('')}</select><label class="label">Wat zou jij volgende keer veranderen? (optioneel)</label><textarea class="area" id="feedbackOpen" placeholder="Jouw idee…"></textarea><p class="muted mini">Je keuzes zijn alleen zichtbaar als totaaloverzicht voor je docent.</p><button class="btn primary" data-act="sendFeedback" id="sendFeedback" disabled>Verstuur mijn feedback →</button></div>`}
function render(){store=load();document.body.className=view==='student'&&theme==='light'?'theme-light':'';let app=document.getElementById('app');if(view==='teacher'&&teacherScreen==='intro')app.innerHTML=introView();else if(view==='teacher'&&teacherScreen==='route')app.innerHTML=routeView();else app.innerHTML=view==='teacher'?teacherView():studentView();bindEvents();}
function bindEvents(){document.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',()=>act(el.dataset.act)));document.querySelectorAll('[data-phase]').forEach(el=>el.onclick=()=>setPhase(+el.dataset.phase));document.querySelectorAll('[data-answer]').forEach(el=>el.onclick=()=>choose(el.dataset.kind,el.dataset.answer,+el.dataset.val));document.querySelectorAll('[data-wait]').forEach(el=>el.onclick=()=>{let ok=el.dataset.wait===el.dataset.correct;document.getElementById('waitResult').textContent=ok?'✓ Goed! Bedenk nu zelf een vergelijkbare vraag.':'Probeer opnieuw en leg uit waarom het andere antwoord beter is.';});document.querySelectorAll('[data-grade]').forEach(el=>el.onclick=()=>{const id=el.dataset.student,q=el.dataset.question,points=+el.dataset.points;save(o=>{const s=o.students.find(s=>s.id===id);if(s){s.finalGrades=s.finalGrades||{};s.finalGrades[q]=points}})});const join=document.getElementById('joinForm');if(join)join.onsubmit=e=>{e.preventDefault();let name=document.getElementById('joinName').value.trim();if(!name)return;let id='s'+stamp();save(o=>o.students.push({id,name,hw:'unknown',scan:{},boost:{},duo:{},final:{},exit:{},scanDone:false}));playerId=id;sessionStorage.setItem(IDENT,id);qpos=0;render()};const hw=document.getElementById('hw');if(hw)hw.onchange=e=>save(o=>{let s=o.students.find(x=>x.id===playerId);if(s)s.hw=e.target.value});document.querySelectorAll('[data-rating]').forEach(el=>el.onclick=()=>{selRating=+el.dataset.rating;document.querySelectorAll('[data-rating]').forEach(x=>x.classList.toggle('selected',x===el));updateFeedbackButton()});document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{selMode=+el.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('selected',x===el));updateFeedbackButton()});}
let selRating=null,selMode=null;function updateFeedbackButton(){let el=document.getElementById('sendFeedback');if(el)el.disabled=selRating===null||selMode===null}
function choose(key,qid,val){
  let s=student();
  if(!s || s[key]?.[qid]!==undefined)return;
  const bank=key==='duo'?CHALLENGES:key==='final'?FINAL:key==='exit'?EXIT:null;
  const index=bank?bank.findIndex(q=>q.id===qid):-1;
  save(o=>{
    let x=o.students.find(s=>s.id===playerId);
    if(!x)return;
    x[key]=x[key]||{};
    x[key][qid]=val;
  });
  // Tijdens de duoquiz en het eindduel wordt een gekozen antwoord meteen opgeslagen.
  // Zo blijft niemand vastzitten op een inactieve knop 'Volgende'.
  if(bank && index>=0){
    if(key==='duo')duopos=Math.min(bank.length-1,index+1);
    if(key==='final')finalpos=Math.min(bank.length-1,index+1);
    if(key==='exit')epos=Math.min(bank.length-1,index+1);
    render();
  }
}
function setPhase(i){save(o=>{o.phase=Math.max(0,Math.min(STAGES.length-1,i));o.remaining=(o.emergency?[5,6,10,0,4,3,5][o.phase]:STAGES[o.phase].mins)*60;o.running=false});}
function act(a){const s=student();if(a==='openStudent'){window.open(location.href.split('#')[0]+'#leerling','_blank');return}if(a==='openTeacher'){window.open(location.href.split('#')[0]+'#docent','_blank');return}if(a==='intro'){stopMusic();teacherScreen='intro';introDone=false;render();return}if(a==='route'){stopMusic();teacherScreen='route';render();return}if(a==='revealIntro'){if(!introDone){introDone=true;playSoftIntro();let tiles=document.querySelectorAll('.introTile');tiles.forEach((el,i)=>setTimeout(()=>el.classList.add('show'),200+i*330));setTimeout(()=>{document.getElementById('introGoal')?.classList.add('show')},1550);setTimeout(()=>{let b=document.querySelector('[data-act="revealIntro"]');if(b)b.textContent='NAAR DE LESROUTE →'},1800)}else{stopMusic();teacherScreen='route';render()}return}if(a==='startDashboard'){teacherScreen='dashboard';render();return}if(a==='theme'){theme=theme==='dark'?'light':'dark';localStorage.setItem('gfr_energie_theme',theme);render();return}if(a==='timer'){save(o=>o.running=!o.running);return}if(a==='resetTimer'){save(o=>{o.remaining=(o.emergency?[5,6,10,0,4,3,5][o.phase]:STAGES[o.phase].mins)*60;o.running=false});return}if(a==='nextStage'){setPhase(store.phase+1);return}if(a==='prevStage'){setPhase(store.phase-1);return}if(a==='emergency'){save(o=>{o.emergency=!o.emergency;if(!o.running)o.remaining=(o.emergency?[5,6,10,0,4,3,5][o.phase]:STAGES[o.phase].mins)*60});return}if(a==='makeTeams'){makeTeams();return}if(a==='publishTeams'){save(o=>o.publishedTeams=!o.publishedTeams);return}if(a==='editTeams'){openTeamEditor();return}if(a==='winner'){if(store.phase<6){alert('De winnaar wordt pas na Missie Voltooid en de Terugblik onthuld.');return}save(o=>o.winnerRevealed=true);const ts=store.teams.slice().sort((a,b)=>teamPoints(b)-teamPoints(a));showModal('🏆 DE GROTE ONTHULLING',ts.length?`<div style="font-size:50px;text-align:center">🥉 🥈 🥇</div><h2 style="font-size:36px;text-align:center">${esc(ts[0].name)}</h2><p style="text-align:center">${teamPoints(ts[0])} punten</p><p style="text-align:center">${ts.slice(0,3).map((t,i)=>`${i+1}. ${esc(t.name)} — ${teamPoints(t)} punten`).join('<br>')}</p>`:'Er zijn nog geen teams.');return}if(a==='addDemo'){save(o=>{for(let i=1;i<=8;i++){const id='demo'+i;if(o.students.some(s=>s.id===id))continue;let ans={};QUESTIONS.forEach((q,j)=>{ans[q.id]=((i*2+j)%7<3)?q.correct:(q.correct+1)%4});o.students.push({id,name:'Demo '+i,hw:i%3===0?'none':i%3===1?'some':'all',scan:ans,boost:{},duo:{},final:{},exit:{},scanDone:true})}});return}if(a==='resetData'){if(confirm('Alle testleerlingen, resultaten en teams verwijderen?')){localStorage.removeItem(STORE);sessionStorage.removeItem(IDENT);playerId='';store=DEFAULT();render()}return}if(a==='scanPrev'){qpos=Math.max(0,qpos-1);render();return}if(a==='scanNext'){qpos=Math.min(7,qpos+1);render();return}if(a==='scanSubmit'){if(QUESTIONS.every(q=>s.scan?.[q.id]!==undefined))save(o=>o.students.find(x=>x.id===playerId).scanDone=true);return}if(a==='boostPrev'){bpos=Math.max(0,bpos-1);render();return}if(a==='boostNext'){bpos=Math.min(boostList(s).length-1,bpos+1);render();return}if(a==='boostDone'){render();return}for(const key of ['duo','final','exit']){if(a===key+'Prev'){setPos(key,-1);return}if(a===key+'Next'){setPos(key,1);return}}if(a==='switchPerson'){playerId='';sessionStorage.removeItem(IDENT);qpos=bpos=duopos=finalpos=epos=0;render();return}if(a==='saveOpenFinal'){const text=document.getElementById('finalOpenAnswer')?.value.trim()||'';if(text.length<12){alert('Schrijf minimaal één volledige uitleg.');return}const q=FINAL[finalpos];save(o=>{const x=o.students.find(x=>x.id===playerId);x.final=x.final||{};x.final[q.id]=text});return}if(a==='saveExitOpen'){const text=document.getElementById('exitOpen')?.value.trim()||'';save(o=>o.students.find(x=>x.id===playerId).exitOpen=text);return}if(a==='saveWork'){const vals={};document.querySelectorAll('.recovery-input').forEach(x=>vals[x.dataset.topic]=x.value);save(o=>{let x=o.students.find(x=>x.id===playerId);x.workAnswers=vals;x.work=Object.values(vals).join(' ').trim()});return}if(a==='sendFeedback'){if(selRating!==null&&selMode!==null){save(o=>o.students.find(x=>x.id===playerId).feedback={rating:selRating,mode:selMode,what:Number(document.getElementById('feedbackWhat')?.value||0),topic:Number(document.getElementById('feedbackTopic')?.value||0),open:document.getElementById('feedbackOpen')?.value||''});selRating=selMode=null}return}if(a==='export'){const rows=[['Naam','Waardering','Start volgend hoofdstuk'],...store.students.filter(s=>s.feedback).map(s=>[s.name,RATINGS[s.feedback.rating],MODES[s.feedback.mode]])];const csv=rows.map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n');const blob=new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download='gfr_leerlingfeedback.csv';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}}
function setPos(key,delta){const s=student(),bank=key==='duo'?CHALLENGES:key==='final'?FINAL:EXIT;if(key==='final'&&store.emergency)bank=bank.slice(0,6);let variable=key==='duo'?'duopos':key==='final'?'finalpos':'epos';let old=key==='duo'?duopos:key==='final'?finalpos:epos;let next=Math.max(0,Math.min(bank.length-1,old+delta));if(delta>0&&s[key]?.[bank[old].id]===undefined){alert('Kies eerst een antwoord op deze vraag. Daarna ga je automatisch verder.');return;}if(key==='duo')duopos=next;else if(key==='final')finalpos=next;else epos=next;render()}
function makeTeams(){let rows=store.students.filter(s=>s.scanDone);if(rows.length<2){alert('Minstens twee leerlingen moeten de Kennisscan afmaken. Je kunt demo-leerlingen toevoegen.');return}const topicSet=Object.keys(TOPICS);const weight=s=>score(s)+((s.hw==='all')?.2:s.hw==='some'?.1:0);let sorted=[...rows].sort((a,b)=>weight(b)-weight(a));let n=Math.floor(rows.length/2);let groups=Array.from({length:n},()=>[]);let odd=rows.length%2;const complement=(s,t)=>topicSet.reduce((a,k)=>{let ps=topicPerf(s).find(x=>x.topic===k),pt=topicPerf(t).find(x=>x.topic===k);return a+(ps.correct/ps.done)*(1-pt.correct/pt.done)+(pt.correct/pt.done)*(1-ps.correct/ps.done)},0);
// strongest paired with weakest; local pair swaps improve complement and total-score balance
for(let i=0;i<n;i++)groups[i]=[sorted[i].id,sorted[sorted.length-1-i].id];if(odd){let middle=sorted[n];let j=groups.map((g,i)=>({i,tot:g.reduce((v,id)=>v+weight(rows.find(s=>s.id===id)),0)})).sort((a,b)=>a.tot-b.tot)[0].i;groups[j].push(middle.id)}
const quality=gs=>{let totals=gs.map(g=>g.reduce((v,id)=>v+weight(rows.find(s=>s.id===id)),0)),avg=totals.reduce((a,b)=>a+b,0)/totals.length;let uneven=totals.reduce((v,x)=>v+Math.abs(x-avg),0);let coverage=gs.reduce((v,g)=>g.length>=2?v+complement(rows.find(s=>s.id===g[0]),rows.find(s=>s.id===g[1])):v,0);return coverage*1.5-uneven*1.8};for(let it=0;it<4;it++){let improved=false;for(let i=0;i<groups.length;i++)for(let j=i+1;j<groups.length;j++)for(let a=0;a<groups[i].length;a++)for(let b=0;b<groups[j].length;b++){let before=quality(groups);[groups[i][a],groups[j][b]]=[groups[j][b],groups[i][a]];if(quality(groups)>before+.01)improved=true;else [groups[i][a],groups[j][b]]=[groups[j][b],groups[i][a]]}if(!improved)break}
save(o=>{o.teams=groups.map((g,i)=>({id:'t'+i,name:(g.length===3?'Trio ':'Duo ')+(i+1),members:g}));o.publishedTeams=false})}
function showModal(title,content){const el=document.createElement('div');el.className='modalBackdrop';el.innerHTML=`<section class="modal"><div class="space"><h2>${esc(title)}</h2><button class="btn" id="closeModal">Sluiten ✕</button></div>${content}</section>`;document.body.appendChild(el);el.querySelector('#closeModal').onclick=()=>el.remove();el.addEventListener('click',e=>{if(e.target===el)el.remove()});}
function openTeamEditor(){if(!store.teams.length){alert('Vorm eerst teams.');return}let content=`<p>Verplaats leerlingen tussen teams. Deze wijziging is direct zichtbaar na publiceren.</p>${store.teams.map(t=>`<div class="team"><strong>${esc(t.name)}</strong>${t.members.map(id=>`<div class="space" style="margin:8px 0"><span>${esc(store.students.find(s=>s.id===id)?.name||'?')}</span><select class="field" style="width:145px" data-move="${id}">${store.teams.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`).join('')}</div>`).join('')}<button class="btn primary" id="saveTeams">Indeling bewaren</button>`;showModal('Duo-indeling bewerken',content);document.getElementById('saveTeams').onclick=()=>{let moves=[...document.querySelectorAll('[data-move]')].map(el=>({student:el.dataset.move,team:el.value}));save(o=>{o.teams.forEach(t=>t.members=[]);moves.forEach(m=>o.teams.find(t=>t.id===m.team)?.members.push(m.student));o.teams=o.teams.filter(t=>t.members.length)});document.querySelector('.modalBackdrop')?.remove()}}
let tickTime=Date.now();setInterval(()=>{let fresh=load();if(view==='teacher'&&teacherScreen==='dashboard'&&fresh.running){let now=Date.now(),dt=Math.max(0,Math.floor((now-tickTime)/1000));if(dt){save(o=>{o.remaining=Math.max(0,o.remaining-dt);if(!o.remaining)o.running=false});tickTime=now}}else tickTime=Date.now()},1000);
window.addEventListener('storage',e=>{if(e.key===STORE){let before=store,updated=load();store=updated;if(before.phase!==updated.phase){qpos=bpos=duopos=finalpos=epos=0;render();return}if(view==='student'&&before.updatedAt!==updated.updatedAt&&before.remaining!==updated.remaining&&JSON.stringify({...before,remaining:0,updatedAt:0,running:false})===JSON.stringify({...updated,remaining:0,updatedAt:0,running:false}))return;render()}});window.addEventListener('hashchange',()=>{view=location.hash==='#leerling'?'student':'teacher';render()});
function playSoftIntro(){try{stopMusic();const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC();audioCtx=ctx;const gain=ctx.createGain();gain.gain.value=.11;gain.connect(ctx.destination);const now=ctx.currentTime+.06;function bell(f,t,len){const osc=ctx.createOscillator(),g=ctx.createGain();osc.type='sine';osc.frequency.value=f;const when=now+t;g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(.2,when+.04);g.gain.exponentialRampToValueAtTime(.0001,when+len);osc.connect(g);g.connect(gain);osc.start(when);osc.stop(when+len+.02)}const melody=[261.63,329.63,392,523.25,440,392,329.63,293.66,261.63];melody.forEach((f,i)=>bell(f,i*.58,1.28));[130.81,174.61,196,130.81].forEach((f,i)=>bell(f,i*1.55,2.2));setTimeout(()=>{if(audioCtx===ctx)stopMusic()},8500)}catch(e){console.warn(e)}}
function stopMusic(){if(audioCtx){try{audioCtx.close()}catch(e){}audioCtx=null}}
render();
</script></body></html>
